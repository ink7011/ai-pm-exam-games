<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<title>NOVA 概念试炼塔 — AI Concept Tower</title>
<style>
:root{
  --bg:#07090f; --panel:#0e131d; --panel2:#121926; --line:#1e2836;
  --cyan:#22d3ee; --green:#34d399; --red:#f87171; --amber:#fbbf24;
  --violet:#a78bfa; --ink:#dbe4f0; --dim:#8b9bb4;
  --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI','Microsoft YaHei',sans-serif;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);
}
/* 氛围光斑 */
body::after{
  content:'';position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:
    radial-gradient(36% 30% at 12% 8%,rgba(34,211,238,.06),transparent 70%),
    radial-gradient(34% 30% at 88% 88%,rgba(167,139,250,.06),transparent 70%);
  animation:orbDrift 26s ease-in-out infinite alternate;
}
@keyframes orbDrift{0%{transform:translate3d(-2%,-1.5%,0)}100%{transform:translate3d(2.5%,2%,0)}}
#app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
/* 面板入场 */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#topbar{animation:fadeUp .4s both}
#left .panel:nth-child(1){animation:fadeUp .45s .08s both}
#left .panel:nth-child(2){animation:fadeUp .45s .16s both}
#center{animation:fadeUp .5s .12s both}
#right .panel:nth-child(1){animation:fadeUp .45s .14s both}
#right .panel:nth-child(2){animation:fadeUp .45s .22s both}

/* ===== topbar ===== */
#topbar{
  display:flex;align-items:center;gap:16px;padding:10px 16px;flex:0 0 auto;
  background:linear-gradient(180deg,#0c1220,#0a0e18);border-bottom:1px solid var(--line);
}
.logo{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.logo b{color:var(--cyan);text-shadow:0 0 12px rgba(34,211,238,.5)}
.logo em{font-style:normal;color:var(--dim);font-size:11px;margin-left:10px;letter-spacing:2px}
#subrank{font-family:var(--mono);font-size:11px;color:var(--violet);margin-left:6px}
.top-actions{margin-left:auto;display:flex;gap:8px}
.top-actions button{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;position:relative;
}
.top-actions button:hover{border-color:var(--cyan);color:var(--cyan)}
.top-actions button .badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:8px;font-size:9px;padding:0 5px;line-height:14px}

/* ===== layout ===== */
#layout{display:grid;grid-template-columns:240px 1fr 250px;gap:12px;padding:12px;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h3{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.panel h3::before{content:'▸';color:var(--cyan)}
#left,#right{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
#center{display:flex;flex-direction:column;min-height:0}

/* hearts / coins / combo —— 动画类（hbeat/anim）由 game.js 仅在数值变化时添加，避免全量重渲染时反复重播 */
.hearts{font-size:20px;letter-spacing:3px;line-height:1}
.hearts .lost{opacity:.22;filter:grayscale(1)}
@keyframes heartLost{0%{transform:scale(1.4);filter:brightness(2)}100%{transform:none;filter:grayscale(1)}}
.hearts span{display:inline-block}
.hearts span.hbeat{animation:heartLost .5s both}
.res-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:10px}
.res-row b{color:var(--ink);font-size:14px}
.res-row b.coins{color:var(--amber)}
@keyframes numPop{0%{transform:scale(1.35);filter:brightness(1.8)}100%{transform:none;filter:none}}
.res-row b.anim{animation:numPop .4s both}
.combo-wrap{margin-top:10px}
.combo{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--cyan);display:inline-block}
.combo.anim{animation:numPop .35s both}
.combo.hot{color:var(--amber);text-shadow:0 0 14px rgba(251,191,36,.6)}
.combo-hint{font-size:11px;color:var(--dim)}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.item-chip{
  font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;
  padding:3px 8px;background:var(--panel2);color:var(--ink);cursor:pointer;position:relative;
}
.item-chip:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.item-chip:disabled{opacity:.35;cursor:not-allowed}
.item-chip .n{color:var(--amber);margin-left:3px}

/* tower progress */
.flr{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:3px 0}
.flr .dot{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 22px}
.flr.done .dot{background:rgba(52,211,153,.15);border-color:var(--green);color:var(--green)}
.flr.now .dot{background:rgba(34,211,238,.18);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.4);animation:nowPulse 2s ease-in-out infinite}
@keyframes nowPulse{0%,100%{box-shadow:0 0 8px rgba(34,211,238,.35)}50%{box-shadow:0 0 18px rgba(34,211,238,.7)}}
.flr.elite .dot{border-color:var(--violet);color:var(--violet)}
.flr.boss .dot{border-color:var(--amber);color:var(--amber)}
.flr.cur{color:var(--ink)}
.shadow-note{margin-top:8px;font-size:11px;color:var(--red);font-family:var(--mono)}

/* ===== battle / screens (center) ===== */
#screen{flex:1;overflow-y:auto;padding:6px 14px 14px}
#screen::-webkit-scrollbar,#left::-webkit-scrollbar,#right::-webkit-scrollbar{width:8px}
#screen::-webkit-scrollbar-thumb,#left::-webkit-scrollbar-thumb,#right::-webkit-scrollbar-thumb{background:#233048;border-radius:4px}
.card{margin:10px 0;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* title screen */
.titlebox{max-width:640px;margin:30px auto;text-align:center}
.titlebox .biglogo{font-family:var(--mono);font-size:32px;font-weight:800;letter-spacing:3px;margin:14px 0 4px;animation:logoIn .7s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes logoIn{from{opacity:0;letter-spacing:10px;filter:blur(6px)}to{opacity:1;letter-spacing:3px;filter:none}}
.titlebox .biglogo b{color:var(--cyan);text-shadow:0 0 30px rgba(34,211,238,.6)}
.titlebox .tagline{color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:2px;margin-bottom:24px;animation:fadeUp .5s .2s both}
.gobtn{
  font:15px var(--mono);letter-spacing:2px;background:linear-gradient(90deg,var(--cyan),var(--violet));
  color:#05070c;font-weight:800;border:none;border-radius:8px;padding:12px 34px;cursor:pointer;
  position:relative;overflow:hidden;transition:.2s;
}
.gobtn::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .5s ease}
.gobtn:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 8px 22px rgba(34,211,238,.25)}
.gobtn:hover::after{left:125%}
.gobtn:active{transform:translateY(0) scale(.98)}

/* tower select */
.towergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.tower{
  text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--ink);padding:13px 15px;cursor:pointer;transition:.18s;font:13px inherit;
  animation:fadeUp .4s both;position:relative;
}
.tower:nth-child(1){animation-delay:.02s}.tower:nth-child(2){animation-delay:.05s}.tower:nth-child(3){animation-delay:.08s}
.tower:nth-child(4){animation-delay:.11s}.tower:nth-child(5){animation-delay:.14s}.tower:nth-child(6){animation-delay:.17s}
.tower:nth-child(7){animation-delay:.2s}.tower:nth-child(8){animation-delay:.23s}.tower:nth-child(9){animation-delay:.26s}
.tower:nth-child(10){animation-delay:.29s}.tower:nth-child(11){animation-delay:.32s}.tower:nth-child(n+12){animation-delay:.35s}
.tower::after{content:'▸';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--cyan);opacity:0;transition:.18s;font-family:var(--mono)}
.tower:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 10px 26px rgba(34,211,238,.12);padding-right:26px}
.tower:hover::after{opacity:1;right:11px}
.tower:active{transform:translateY(-1px) scale(.99)}
.tower .tn{font-weight:700;font-size:14px}
.tower .td{color:var(--dim);font-size:11.5px;margin-top:3px;font-family:var(--mono)}
.tower .best{color:var(--amber);font-family:var(--mono);font-size:11px;margin-top:5px}
.tgroup-h{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:8px 0 2px;padding-top:6px}
.tgroup-h:first-child{margin-top:0}
.tg-label{font-family:var(--mono);font-size:11.5px;letter-spacing:2px;color:var(--cyan)}
.tg-tip{font-size:11px;color:var(--dim)}
.tower.company{border-color:rgba(251,191,36,.4)}
.tower.locked{border-style:dashed;filter:saturate(.7) brightness(.85)}
.tower.locked:hover{filter:none}
.lock-tag{color:var(--amber);font-family:var(--mono);font-size:11.5px;margin-top:6px;border:1px solid rgba(251,191,36,.5);border-radius:5px;padding:2px 8px;display:inline-block;background:rgba(251,191,36,.07)}
.paywall{max-width:520px}
.pw-head{font-size:17px;font-weight:700;margin-bottom:6px}
.pw-desc{color:var(--dim);font-size:12.5px;line-height:1.8;margin-bottom:10px}
.pw-price{font-size:14px;margin-bottom:12px}
.pw-price b{color:var(--amber);font-size:20px}
.pw-price span{color:var(--dim);font-size:11.5px}
#codeInput{width:100%;background:#0b111c;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:11px 14px;font:14px var(--mono);letter-spacing:1px;outline:none;text-align:center}
#codeInput:focus{border-color:var(--cyan)}
.pw-buy{display:block;text-align:center;margin:2px 0 12px;background:linear-gradient(90deg,#1f9cf0,#22d3ee);border:none;color:#05070c;font:700 14px var(--mono);border-radius:9px;padding:13px;cursor:pointer;text-decoration:none}
.pw-buy:hover{filter:brightness(1.12)}
.pw-pay{margin:4px 0 12px;border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center}
.pw-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.pw-tab{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:6px 16px;cursor:pointer;font:12px var(--mono)}
.pw-tab.on{border-color:var(--cyan);color:var(--cyan)}
.pw-qr{max-width:190px;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto}
.pw-qr-miss{color:var(--dim);font:11px var(--mono);padding:40px 10px;border:1px dashed var(--line);border-radius:10px;margin:0 auto;max-width:190px}
.pw-qr-note{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.7}
.pw-qr-note b{color:var(--amber)}
.pw-btn{display:block;width:100%;margin-top:10px;background:linear-gradient(90deg,var(--amber),#fb7185);border:none;color:#05070c;font:700 14px var(--mono);border-radius:9px;padding:12px;cursor:pointer}
.pw-btn:hover{filter:brightness(1.1)}
.pw-tip{margin-top:12px;color:var(--dim);font-size:11.5px;line-height:1.8;border-top:1px dashed var(--line);padding-top:10px}
.tower.company .tn::before{content:'🏢 ';font-size:12px}
.tower.company:hover{border-color:var(--amber)}
.lb-me{border:1px solid rgba(34,211,238,.4);border-radius:10px;padding:10px 14px;background:rgba(34,211,238,.05);margin-top:4px}
.lb-pid{font-family:var(--mono);font-size:11px;color:var(--dim)}
.lb-pid b{color:var(--cyan)}
.lb-tower{font-size:13px;margin-top:6px;line-height:1.7}
.lb-tower b{color:var(--amber)}
.lb-parts{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px}
.lb-head{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--dim);margin:12px 0 6px}
.lb-row{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px dashed #1a2333}
.lb-name{flex:1;font-size:12.5px}
.lb-tier{font-family:var(--mono);font-size:10.5px}
.lb-tier.t1,.lb-tier.t2,.lb-tier.t3{color:var(--dim)}
.lb-tier.t4,.lb-tier.t5,.lb-tier.t6{color:var(--green)}
.lb-tier.t7,.lb-tier.t8{color:var(--cyan)}
.lb-tier.t9,.lb-tier.t10{color:var(--amber)}
.lb-val{font-family:var(--mono);font-size:12px;color:var(--ink)}
.lb-note{font-size:10.5px;color:var(--dim);margin:-2px 0 4px;padding-left:2px}
.lb-foot{font-size:10.5px;color:var(--dim);margin-top:10px;line-height:1.7}
.weak-tip{
  border:1px dashed rgba(251,191,36,.5);border-radius:10px;padding:10px 14px;margin:12px 0;
  color:var(--amber);font-size:12.5px;background:rgba(251,191,36,.05);
}

/* battle card */
.battle{
  background:var(--panel);border:1px solid #2a3548;border-radius:14px;padding:18px 20px;margin:14px 0;
  animation:battleIn .38s cubic-bezier(.2,.8,.3,1.08) both;
}
@keyframes battleIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.battle.boss{border-color:rgba(251,191,36,.55);box-shadow:0 0 26px rgba(251,191,36,.08)}
.battle.elite{border-color:rgba(167,139,250,.5)}
.b-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--mono);font-size:11px}
.b-head .chip{border:1px solid var(--line);border-radius:5px;padding:2px 8px;color:var(--dim)}
.b-head .chip.f{color:var(--cyan);border-color:var(--cyan)}
.b-head .chip.elite{color:var(--violet);border-color:var(--violet)}
.b-head .chip.bossc{color:var(--amber);border-color:var(--amber)}
.b-head .chip.shadow{color:var(--red);border-color:var(--red)}
.qtext{font-size:15.5px;font-weight:600;line-height:1.75;margin-bottom:14px;animation:fadeUp .3s .06s both}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:10px 13px;cursor:pointer;font:13.5px/1.6 inherit;transition:.14s;
  display:flex;gap:10px;align-items:flex-start;
  animation:optIn .3s both;
}
.opt:nth-child(1){animation-delay:.08s}.opt:nth-child(2){animation-delay:.14s}
.opt:nth-child(3){animation-delay:.2s}.opt:nth-child(4){animation-delay:.26s}
@keyframes optIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.opt .ol{font-family:var(--mono);color:var(--dim);font-weight:700;flex:0 0 14px;transition:.14s}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(4px);box-shadow:0 4px 16px rgba(34,211,238,.1)}
.opt:hover:not(:disabled) .ol{color:var(--cyan)}
.opt:active:not(:disabled){transform:translateX(2px) scale(.99)}
.opt:disabled{cursor:default;opacity:.55}
@keyframes rightPop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
.opt.right{border-color:var(--green);background:rgba(52,211,153,.12);opacity:1;animation:rightPop .45s both;box-shadow:0 0 18px rgba(52,211,153,.22)}
.opt.wrongpick{border-color:var(--red);background:rgba(248,113,113,.1);opacity:.9;animation:shake .4s both}
.opt.zapped{opacity:.25;text-decoration:line-through}
.timerbar{height:6px;background:#1a2230;border-radius:3px;overflow:hidden;margin-bottom:12px}
.timerbar i{display:block;height:100%;background:var(--violet);border-radius:3px;transition:width .3s linear}
.timerbar.danger i{background:var(--red);animation:dangerBlink 1s steps(2) infinite}
@keyframes dangerBlink{50%{filter:brightness(1.6)}}
.hintline{margin-top:10px;font-size:12.5px;color:var(--amber);border:1px dashed rgba(251,191,36,.5);border-radius:7px;padding:7px 11px;background:rgba(251,191,36,.05)}

/* verdict */
.verdict{border-radius:10px;padding:12px 15px;margin-top:14px;font-size:13.5px;line-height:1.75;animation:verdictIn .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes verdictIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.verdict.good{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.45)}
.verdict.bad{background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.45)}
.verdict .v-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;display:block;margin-bottom:5px}
.verdict.good .v-tag{color:var(--green)} .verdict.bad .v-tag{color:var(--red)}
.verdict .kd{color:var(--violet);font-family:var(--mono);font-size:12px;margin-top:4px;display:block}
/* 答题解析（exp）：答对淡青、答错琥珀更醒目 */
.expl-line{margin-top:9px;padding:8px 12px;border-radius:7px;font-size:12.5px;line-height:1.75;color:var(--ink);background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.35);animation:fadeUp .35s .12s both}
.expl-line .el-tag{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--cyan);margin-bottom:2px}
.verdict.bad .expl-line{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.6)}
.verdict.bad .expl-line .el-tag{color:var(--amber)}
.nextbtn{
  margin-top:14px;font:13px var(--mono);letter-spacing:1px;background:linear-gradient(90deg,var(--cyan),var(--violet));
  border:none;border-radius:7px;padding:10px 24px;cursor:pointer;color:#05070c;font-weight:700;
  position:relative;overflow:hidden;transition:.18s;
}
.nextbtn::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .5s ease}
.nextbtn:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 6px 18px rgba(34,211,238,.22)}
.nextbtn:hover::after{left:125%}
.nextbtn:active{transform:none;filter:brightness(.95)}
.retrybtn{
  margin-top:14px;margin-left:10px;font:12.5px var(--mono);background:transparent;color:var(--amber);
  border:1px solid rgba(251,191,36,.55);border-radius:7px;padding:9px 16px;cursor:pointer;
}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.shopitem{
  text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  padding:12px 14px;cursor:pointer;font:13px inherit;transition:.18s;
  animation:fadeUp .35s both;
}
.shopitem:nth-child(1){animation-delay:.03s}.shopitem:nth-child(2){animation-delay:.07s}
.shopitem:nth-child(3){animation-delay:.11s}.shopitem:nth-child(n+4){animation-delay:.15s}
.shopitem:hover:not(:disabled){border-color:var(--amber);transform:translateY(-3px);box-shadow:0 10px 24px rgba(251,191,36,.12)}
.shopitem:active:not(:disabled){transform:translateY(-1px)}
.shopitem:disabled{opacity:.4;cursor:not-allowed}
.shopitem .sn{font-weight:700}
.shopitem .sd{color:var(--dim);font-size:11.5px;margin:4px 0}
.shopitem .sc{font-family:var(--mono);color:var(--amber)}

/* result */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.rcell{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel2);text-align:center;animation:rcellIn .4s cubic-bezier(.2,.8,.3,1.15) both}
.rcell:nth-child(1){animation-delay:.05s}.rcell:nth-child(2){animation-delay:.11s}.rcell:nth-child(3){animation-delay:.17s}
.rcell:nth-child(4){animation-delay:.23s}.rcell:nth-child(5){animation-delay:.29s}.rcell:nth-child(n+6){animation-delay:.35s}
@keyframes rcellIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.rcell .rv{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--cyan)}
.rcell .rk{font-size:11px;color:var(--dim);margin-top:2px}
.modacc{margin-top:10px}
.mrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.mrow .mbar{flex:1;height:7px;background:#1a2230;border-radius:4px;overflow:hidden}
.mrow .mbar i{display:block;height:100%;border-radius:4px}
.mrow b{width:38px;text-align:right;color:var(--ink)}

/* modals */
#modalRoot .backdrop{position:fixed;inset:0;background:rgba(3,5,10,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s both;backdrop-filter:blur(2px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(860px,94vw);max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid #2a3548;border-radius:14px;padding:22px 26px;animation:modalIn .28s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes modalIn{from{opacity:0;transform:scale(.955) translateY(8px)}to{opacity:1;transform:none}}
.modal h2{font-family:var(--mono);font-size:16px;letter-spacing:2px;color:var(--cyan);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal h2 .x{cursor:pointer;color:var(--dim);font-size:14px;border:1px solid var(--line);border-radius:6px;padding:2px 9px}
.modal h2 .x:hover{color:var(--red);border-color:var(--red)}
.kitem{border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin-bottom:8px;background:var(--panel2);font-size:12.5px}
.kitem b{color:var(--cyan)}
.kitem .st{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.kitem .miss{color:var(--red)} .kitem .ok{color:var(--green)}
.kitem p{color:var(--dim);margin-top:3px}
.mfoot{color:var(--dim);font-size:12px;margin-top:14px;font-family:var(--mono)}

/* toast + fx */
#toastRoot{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#0d1420;border:1px solid var(--cyan);color:var(--ink);border-radius:8px;padding:10px 16px;font-family:var(--mono);font-size:12px;animation:toastIn .38s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 4px 24px rgba(0,0,0,.5)}
@keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.96)}to{opacity:1;transform:none}}
.toast.ok{border-color:var(--green)} .toast.err{border-color:var(--red)} .toast.gold{border-color:var(--amber);color:var(--amber)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.battle.shake{animation:shake .45s}
/* 尊重系统减弱动效偏好 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@keyframes slash{0%{box-shadow:0 0 0 rgba(52,211,153,0)}30%{box-shadow:0 0 34px rgba(52,211,153,.55)}100%{box-shadow:0 0 0 rgba(52,211,153,0)}}
.battle.slash{animation:slash .6s}
kbd{font-family:var(--mono);font-size:10.5px;background:#1a2230;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--dim)}

@media (max-width:1020px){
  #layout{grid-template-columns:1fr;overflow-y:auto}
  #left,#right{flex-direction:row;flex-wrap:wrap}
  #left .panel,#right .panel{flex:1 1 220px}
  body{overflow:auto}
}
.dexp{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.dopt{font-size:12px;line-height:1.6;color:#e08e84;padding:4px 8px;background:rgba(239,68,68,.06);border-left:2px solid rgba(239,68,68,.45);border-radius:0 4px 4px 0}
.dopt b{font-family:var(--mono);margin-right:8px;color:#ef4444}
.dopt.ok{color:#86efac;background:rgba(52,211,153,.07);border-left-color:rgba(52,211,153,.5)}
.dopt.ok b{color:#34d399}
.baglist{display:flex;flex-direction:column;gap:8px}
.bagrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.bag-ic{font-size:24px;width:34px;text-align:center}
.bag-b{flex:1;min-width:0}
.bag-b b{display:block;font-size:14px;color:var(--ink)}
.bag-b span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.bag-n{font-family:var(--mono);font-style:normal;color:var(--amber);font-size:14px}
.bag-n.dim{color:var(--dim);font-size:11px}
.bagtip{margin-top:10px;font-size:12px;color:var(--dim);line-height:1.8}
.pl-sum{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:14px;color:var(--ink)}
.pl-sum b{color:var(--amber);font-size:16px}
.pl-sum span{display:block;font-size:12px;color:var(--dim);margin-top:4px}
.pl-row{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.pl-row.locked{opacity:.55}
.pl-ic{font-size:22px;width:32px;text-align:center}
.pl-b{flex:1;min-width:0}
.pl-b b{display:block;font-size:14px;color:var(--ink)}
.pl-b span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.pl-bar{display:inline-flex;align-items:center;gap:8px}
.pl-track{display:block;height:6px;width:90px;background:#1a2230;border-radius:3px;overflow:hidden}
.pl-track i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#22d3ee)}
.pl-bar b{font-family:var(--mono);font-size:12px;color:var(--amber)}
.pl-tip{margin-top:8px;font-size:12px;color:var(--dim);line-height:1.8}
</style>
</head>

  <header id="topbar">
    <div class="logo" onclick="location.href='../index.html'" title="回到门户 · SHUAMONE 耍门" style="cursor:pointer">SHUA<b>MONE</b><em>概念试炼塔 · CONCEPT TOWER</em></div>

    </div>

  <main id="layout">
    <aside id="left">
      <section class="panel" id="playerPanel"></section>

          <kbd>A</kbd>–<kbd>D</kbd> 或 <kbd>1</kbd>–<kbd>4</kbd> 选择答案<br>

      </section>
    </aside>
    <section id="center"><div id="screen"></div></section>
    <aside id="right">
      <section class="panel" id="towerPanel"><h3>试炼进度</h3><div id="floors">—</div></section>
      <section class="panel"><h3>暗影层机制</h3>
        <div style="font-size:12px;color:var(--dim);line-height:1.8">答错的题不会消失——它们化为<b style="color:var(--red)">暗影</b>，在数层之后回塔复仇。连续两次答对同一暗影，才算真正净化它（跨局生效）。</div>
      </section>
    </aside>
  </main>
