<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#07090f;font-family:-apple-system,'PingFang SC',sans-serif;position:relative;overflow:hidden}
body::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
.wrap{position:absolute;inset:70px;display:flex;flex-direction:column}
.h{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:6px;color:#22d3ee;margin-bottom:10px}
.st{font-size:50px;font-weight:900;color:#dbe4f0;margin-bottom:34px}
.shot{flex:1;border:2px solid #26324a;border-radius:26px;overflow:hidden;position:relative;background:#0e131d}
.shot img{width:100%;height:100%;object-fit:contain;object-position:top center}
.pts{margin-top:32px;display:flex;flex-direction:column;gap:18px}
.pt{display:flex;gap:18px;align-items:flex-start}
.n{flex:0 0 46px;height:46px;border-radius:12px;background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.5);color:#22d3ee;display:flex;align-items:center;justify-content:center;font:800 24px ui-monospace,Menlo,monospace}
.pt div{font-size:30px;color:#dbe4f0;line-height:1.55;padding-top:4px}
.pt b{color:#22d3ee}
.pt em{font-style:normal;color:#fbbf24}
</style></head><body>
<div class="wrap">
  <div class="h">GAMEPLAY 01 // RPG</div>
  <div class="st">不是刷题，是「活」一道题</div>
  <div class="shot"><img src="../../docs/images/rpg-gameplay.png"></div>
  <div class="pts">
    <div class="pt"><span class="n">1</span><div>先<b>调查线索</b>（查数据/看会话/调工单）再决策</div></div>
    <div class="pt"><span class="n">2</span><div>选错真的会掉指标——<em>后果即记忆</em></div></div>
  </div>
</div>
</body></html>
