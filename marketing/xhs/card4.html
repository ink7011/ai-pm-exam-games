<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#07090f;font-family:-apple-system,'PingFang SC',sans-serif;position:relative;overflow:hidden}
body::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
.wrap{position:absolute;inset:70px;display:flex;flex-direction:column}
.h{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:6px;color:#a78bfa;margin-bottom:10px}
.st{font-size:50px;font-weight:900;color:#dbe4f0;margin-bottom:34px}
.shot{flex:1;border:2px solid #26324a;border-radius:26px;overflow:hidden;background:#0e131d}
.shot img{width:100%;height:100%;object-fit:contain;object-position:top center}
.pts{margin-top:32px;display:flex;flex-direction:column;gap:18px}
.pt{display:flex;gap:18px;align-items:flex-start}
.n{flex:0 0 46px;height:46px;border-radius:12px;background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.5);color:#a78bfa;display:flex;align-items:center;justify-content:center;font:800 24px ui-monospace,Menlo,monospace}
.pt div{font-size:30px;color:#dbe4f0;line-height:1.55;padding-top:4px}
.pt b{color:#a78bfa}
.pt em{font-style:normal;color:#fbbf24}
</style></head><body>
<div class="wrap">
  <div class="h">GAMEPLAY 02 // 试炼塔</div>
  <div class="st">答错不亏，它会「记仇」</div>
  <div class="shot"><img src="../../docs/images/tower-expl.png"></div>
  <div class="pts">
    <div class="pt"><span class="n">1</span><div><b>每题带一句话解析</b>：答对青色，答错琥珀色更醒目</div></div>
    <div class="pt"><span class="n">2</span><div>错题化为<em>暗影</em>，3层后回来复仇——连对两次净化</div></div>
  </div>
</div>
</body></html>
