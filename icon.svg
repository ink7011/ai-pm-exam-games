  <!-- 塔窗：字母 N 的抽象点缀 -->
  <g fill="url(#shua-g)">
    <rect x="200" y="366" width="18" height="30" rx="4"/>
    <rect x="247" y="366" width="18" height="30" rx="4"/>
    <rect x="294" y="366" width="18" height="30" rx="4"/>
    <rect x="238" y="270" width="18" height="30" rx="4"/>
    <rect x="284" y="270" width="18" height="30" rx="4"/>
  </g>
  <!-- 天顶星 -->
  <path d="M256 56l11 25 25 11-25 11-11 25-11-25-25-11 25-11z" fill="#fbbf24"/>
