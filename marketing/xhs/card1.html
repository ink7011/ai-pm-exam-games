<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#07090f;font-family:-apple-system,'PingFang SC','Segoe UI',sans-serif;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;background:
 radial-gradient(40% 30% at 15% 10%,rgba(34,211,238,.10),transparent 70%),
 radial-gradient(36% 30% at 85% 88%,rgba(167,139,250,.10),transparent 70%)}
body::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
.wrap{position:absolute;inset:70px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:8px;color:#8b9bb4;margin-bottom:34px}
.h1{font-size:96px;font-weight:900;line-height:1.28;color:#dbe4f0}
.h1 b{color:#22d3ee;text-shadow:0 0 40px rgba(34,211,238,.45)}
.h2{margin-top:38px;font-size:40px;color:#8b9bb4;line-height:1.6;font-weight:600}
.h2 em{font-style:normal;color:#fbbf24}
.badge{margin-top:56px;display:inline-flex;gap:16px;align-items:center;font-family:ui-monospace,Menlo,monospace;font-size:26px;color:#05070c}
.b1{background:linear-gradient(90deg,#22d3ee,#a78bfa);border-radius:14px;padding:14px 30px;font-weight:800}
.b2{background:transparent;border:2px solid #26324a;color:#dbe4f0;border-radius:14px;padding:14px 30px}
.foot{position:absolute;bottom:70px;left:70px;right:70px;display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,monospace;font-size:22px;color:#5a6b84;letter-spacing:3px}
</style></head><body>
<div class="wrap">
  <div class="kicker">NOVA·AI GAMES // 真实备考故事</div>
  <div class="h1">腾讯的AI产品笔试<br>居然是个<br><b>RPG游戏</b>？！</div>
  <div class="h2">被测评震撼到的我，干脆做了个<em>开源游戏版题库</em><br>免费的，浏览器直接玩</div>
  <div class="badge"><span class="b1">▶ 免费在线玩</span><span class="b2">245题 · 全解析</span></div>
</div>
<div class="foot"><span>AI产品经理 / 产品运营 · 笔试备考</span><span>BUILD. BREAK. FIX. SHIP.</span></div>
</body></html>
