<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SHUAMONE 耍门">
  <!-- 深空底 + 青色塔 + 天顶星：SHUAMONE 品牌元素 -->
  <rect width="512" height="512" rx="96" fill="#07090f"/>
  <defs>
    <linearGradient id="shua-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="shua-halo" cx="0.5" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="72" fill="url(#shua-halo)"/>
  <g fill="none" stroke="url(#shua-g)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <path d="M104 436h304"/>
    <path d="M144 436v-98h224v98"/>
    <path d="M184 338v-98h144v98"/>
    <path d="M222 240v-90h68v90"/>
    <path d="M256 150v-46"/>
