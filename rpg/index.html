<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090f">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<title>AI PRODUCT RPG — Build. Break. Fix. Ship.</title>
<style>
:root{
  --bg:#07090f; --panel:#0e131d; --panel2:#121926; --line:#1e2836;
  --cyan:#22d3ee; --green:#34d399; --red:#f87171; --amber:#fbbf24;
  --violet:#a78bfa; --ink:#dbe4f0; --dim:#7c8ba1; --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI','Microsoft YaHei',sans-serif;
  overflow:hidden;
}
body::before{ /* subtle scanlines */
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);
}
/* 氛围光斑（缓慢漂移，保留终端品牌感） */
body::after{
  content:''; position:fixed; inset:-20%; pointer-events:none; z-index:0;
  background:
    radial-gradient(36% 30% at 12% 8%,rgba(34,211,238,.055),transparent 70%),
    radial-gradient(34% 30% at 88% 88%,rgba(167,139,250,.055),transparent 70%);
  animation:orbDrift 26s ease-in-out infinite alternate;
}
@keyframes orbDrift{0%{transform:translate3d(-2%,-1.5%,0)}100%{transform:translate3d(2.5%,2%,0)}}
#app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}
/* 面板入场 */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#topbar{animation:fadeUp .4s both}
#left .panel:nth-child(1){animation:fadeUp .45s .08s both}
#left .panel:nth-child(2){animation:fadeUp .45s .16s both}
#center{animation:fadeUp .5s .12s both}
#right .panel:nth-child(1){animation:fadeUp .45s .14s both}
#right .panel:nth-child(2){animation:fadeUp .45s .22s both}

/* ===== top bar ===== */
#topbar{
  display:flex;align-items:center;gap:16px;padding:10px 16px;
  background:linear-gradient(180deg,#0c1220,#0a0e18);border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.logo{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:.5px;white-space:nowrap}
.logo b{color:var(--cyan);text-shadow:0 0 12px rgba(34,211,238,.5)}
.logo em{font-style:normal;color:var(--dim);font-size:11px;margin-left:10px;letter-spacing:2px}
#ticker{flex:1;overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--dim);
  mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#ticker span{display:inline-block;padding-left:100%;animation:tick 38s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.top-actions{display:flex;gap:8px}
.top-actions button{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;position:relative;
}
.top-actions button:hover{border-color:var(--cyan);color:var(--cyan)}
.top-actions button .badge{
  position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:8px;
  font-size:9px;padding:0 5px;line-height:14px;
}

/* ===== 3-column layout ===== */
#layout{display:grid;grid-template-columns:250px 1fr 270px;gap:12px;padding:12px;flex:1;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h3{
  font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:2px;
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.panel h3::before{content:'▸';color:var(--cyan)}
#left,#right{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
#center{display:flex;flex-direction:column;min-height:0}

/* character panel */
.char-name{font-size:18px;font-weight:700;margin-bottom:2px}
.char-role{font-family:var(--mono);color:var(--cyan);font-size:12px;margin-bottom:10px}
.xp-row{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;justify-content:space-between;margin:8px 0 4px}
.xpbar{height:6px;background:#1a2230;border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:3px;transition:width .6s}
.stat-line{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;margin-top:6px;color:var(--dim)}
.stat-line b{color:var(--ink)}
.stat-line b.good{color:var(--green)} .stat-line b.bad{color:var(--red)}

/* company bars */
.metric{margin-bottom:9px}
.metric .m-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:3px}
.metric .m-head b{color:var(--ink)}
.bar{height:7px;background:#1a2230;border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:4px;transition:width .7s;background:var(--cyan)}
.bar.rev i{background:var(--red)}
.delta{font-size:10px;margin-left:6px;display:inline-block;animation:deltaPop .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes deltaPop{0%{opacity:0;transform:translateY(6px) scale(.8)}30%{opacity:1;transform:translateY(-2px) scale(1.12)}100%{opacity:1;transform:none}}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
@keyframes flash{0%{filter:brightness(2.2)}100%{filter:none}}
.bar i.flash{animation:flash .9s}

/* case panel */
#casePanel .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-family:var(--mono);font-size:10px;color:var(--violet);border:1px solid #2d3550;border-radius:4px;padding:1px 7px;background:#161c2c}
#casePanel .brief{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.6}

/* ===== feed ===== */
#feed{flex:1;overflow-y:auto;padding:4px 14px 14px} /* 滚动用 JS 瞬时定位，避免平滑滚动竞争 */
#feed::-webkit-scrollbar,#left::-webkit-scrollbar,#right::-webkit-scrollbar{width:8px}
#feed::-webkit-scrollbar-thumb,#left::-webkit-scrollbar-thumb,#right::-webkit-scrollbar-thumb{background:#233048;border-radius:4px}
.card{margin:10px 0;animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* slack message */
.msg{display:flex;gap:10px;animation:msgIn .4s cubic-bezier(.2,.8,.3,1.05) both}
@keyframes msgIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.avatar{
  flex:0 0 34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:13px;color:#05070c;
  animation:avIn .35s .08s cubic-bezier(.2,.9,.3,1.4) both;
}
@keyframes avIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.msg-body{flex:1;min-width:0}
.msg-head{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:2px}
.msg-head b{color:var(--ink);font-size:12px}
.msg-text{
  background:var(--panel2);border:1px solid var(--line);border-radius:0 10px 10px 10px;
  padding:9px 12px;white-space:pre-wrap;
}
.msg.urgent .msg-text{border-color:rgba(248,113,113,.55);box-shadow:0 0 18px rgba(248,113,113,.12) inset}
/* 角色头像（cast.js SVG） */
svg.av-svg{flex:0 0 34px;width:34px;height:34px;border-radius:8px}
.av-svg rect:first-child{rx:8}
/* BOSS 立绘 */
.boss-art{margin:14px auto 2px;max-width:420px;border-radius:12px;overflow:hidden;box-shadow:0 0 34px rgba(248,113,113,.22);animation:bossIn .6s cubic-bezier(.2,.9,.3,1.1) both}
.boss-art svg{display:block;width:100%;height:auto}
@keyframes bossIn{from{opacity:0;transform:scale(.94);filter:brightness(1.6)}to{opacity:1;transform:none;filter:none}}
.msg.urgent .msg-head b{color:var(--red)}

/* system / terminal cards */
.syscard{
  background:#0b111c;border:1px solid var(--line);border-left:3px solid var(--cyan);
  border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:12.5px;
}
.syscard .sc-title{color:var(--cyan);font-size:10.5px;letter-spacing:2px;margin-bottom:6px}
.syscard p{margin:3px 0;color:var(--ink)}
.syscard .dim{color:var(--dim)}
.clue{border-left-color:var(--green)}
.clue .sc-title{color:var(--green)}
.titlecard{
  border:1px solid #243048;border-radius:12px;padding:18px 20px;margin:16px 0;
  background:linear-gradient(135deg,#0d1524,#0b0f1a);
  animation:cardIn .5s cubic-bezier(.2,.8,.3,1.06) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.titlecard .kicker{font-family:var(--mono);color:var(--cyan);font-size:11px;letter-spacing:3px;margin-bottom:6px}
.titlecard h2{font-size:20px;margin-bottom:4px}
.titlecard .sub{color:var(--dim);font-size:12.5px}
.titlecard.boss{border-color:rgba(251,191,36,.5)}
.titlecard.boss .kicker{color:var(--amber)}

/* decision */
.decision{background:var(--panel);border:1px solid #2a3548;border-radius:12px;padding:16px;margin:14px 0;animation:battleIn .38s cubic-bezier(.2,.8,.3,1.08) both}
@keyframes battleIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.decision .q-label{font-family:var(--mono);font-size:10.5px;color:var(--amber);letter-spacing:2px;margin-bottom:8px}
.decision .q{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.7;animation:fadeUp .3s .05s both}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:10px 13px;cursor:pointer;font:13.5px/1.6 inherit;transition:.15s;
  display:flex;gap:10px;align-items:flex-start;animation:optIn .3s both;
}
.opt:nth-child(1){animation-delay:.07s}.opt:nth-child(2){animation-delay:.13s}
.opt:nth-child(3){animation-delay:.19s}.opt:nth-child(4){animation-delay:.25s}
@keyframes optIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.opt .ol{font-family:var(--mono);color:var(--dim);font-weight:700;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(4px);box-shadow:0 4px 16px rgba(34,211,238,.1)}
.opt:hover:not(:disabled) .ol{color:var(--cyan)}
.opt:active:not(:disabled){transform:translateX(2px) scale(.99)}
.opt:disabled{cursor:default;opacity:.55}
@keyframes optShake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.08);opacity:.8;animation:optShake .4s both}
@keyframes rightPop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
.opt.right{border-color:var(--green);background:rgba(52,211,153,.1);opacity:1;animation:rightPop .45s both;box-shadow:0 0 18px rgba(52,211,153,.22)}
.hintcard{
  border:1px dashed rgba(251,191,36,.6);border-radius:8px;padding:9px 13px;margin-top:12px;
  color:var(--amber);font-size:12.5px;background:rgba(251,191,36,.05);
}
.hintcard b{font-family:var(--mono)}

/* verdict banners */
.verdict{border-radius:10px;padding:13px 16px;margin:12px 0;font-size:13.5px;line-height:1.7;animation:verdictIn .38s cubic-bezier(.2,.9,.3,1.18) both}
@keyframes verdictIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.verdict.good{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.45)}
.verdict.bad{background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.45)}
.verdict.teach{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.4)}
.verdict .v-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;display:block;margin-bottom:5px}
.verdict.good .v-tag{color:var(--green)} .verdict.bad .v-tag{color:var(--red)} .verdict.teach .v-tag{color:var(--violet)}

/* knowledge unlock */
.kp{
  border:1px solid rgba(34,211,238,.5);border-radius:10px;padding:13px 16px;margin:12px 0;
  background:linear-gradient(135deg,rgba(34,211,238,.07),rgba(167,139,250,.06));
  box-shadow:0 0 24px rgba(34,211,238,.08);
  animation:kpIn .5s cubic-bezier(.2,.9,.3,1.15) both, kpGlow 2.6s .6s ease-in-out 2;
}
@keyframes kpIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes kpGlow{0%,100%{box-shadow:0 0 18px rgba(34,211,238,.1)}50%{box-shadow:0 0 30px rgba(34,211,238,.22)}}
.kp .kp-tag{font-family:var(--mono);font-size:10.5px;color:var(--cyan);letter-spacing:2px;margin-bottom:6px}
.kp .kp-name{font-weight:700;font-size:15px;margin-bottom:6px}
.kp .kp-body{font-size:13px;color:var(--ink);line-height:1.75}
.kp .kp-exam{margin-top:8px;font-size:12px;color:var(--amber);font-family:var(--mono)}

/* action bar */
#actionBar{flex:0 0 auto;padding:10px 14px 14px;border-top:1px solid var(--line);background:#0a0e18}
.ab-label{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:2px;margin-bottom:8px}
.ab-btns{display:flex;flex-wrap:wrap;gap:8px}
.ab-btn{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:9px 14px;cursor:pointer;font:13px inherit;text-align:left;transition:.15s;
}
.ab-btn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.ab-btn:disabled{opacity:.4;cursor:not-allowed}
.ab-btn.primary{border-color:var(--cyan);background:rgba(34,211,238,.12);color:var(--cyan);font-family:var(--mono)}
.ab-btn .cnt{font-family:var(--mono);font-size:11px;color:var(--amber);margin-left:6px}

/* start screen */
.startbox{max-width:560px;margin:40px auto;text-align:center}
.startbox .biglogo{font-family:var(--mono);font-size:34px;font-weight:800;letter-spacing:4px;margin:18px 0 6px}
.startbox .biglogo b{color:var(--cyan);text-shadow:0 0 30px rgba(34,211,238,.6)}
.startbox .tagline{color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:2px;margin-bottom:26px}
.startbox input{
  width:70%;background:#0b111c;border:1px solid var(--line);border-radius:8px;color:var(--ink);
  padding:11px 14px;font:15px inherit;text-align:center;outline:none;margin:6px 0 14px;
}
.startbox input:focus{border-color:var(--cyan)}
.gobtn{
  font:15px var(--mono);letter-spacing:2px;background:linear-gradient(90deg,var(--cyan),var(--violet));
  color:#05070c;font-weight:800;border:none;border-radius:8px;padding:12px 34px;cursor:pointer;
  position:relative;overflow:hidden;transition:.2s;
}
.gobtn::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .5s ease}
.gobtn:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 8px 22px rgba(34,211,238,.25)}
.gobtn:hover::after{left:125%}
.gobtn:active{transform:translateY(0) scale(.98)}
.startbox .bg-note{color:var(--dim);font-size:12px;margin:16px 0 0}

/* modal */
#modalRoot .backdrop{position:fixed;inset:0;background:rgba(3,5,10,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s both;backdrop-filter:blur(2px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:min(860px,94vw);max-height:86vh;overflow-y:auto;background:var(--panel);
  border:1px solid #2a3548;border-radius:14px;padding:22px 26px;
  animation:modalIn .28s cubic-bezier(.2,.9,.3,1.1) both;
}
@keyframes modalIn{from{opacity:0;transform:scale(.955) translateY(8px)}to{opacity:1;transform:none}}
.modal h2{font-family:var(--mono);font-size:16px;letter-spacing:2px;color:var(--cyan);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal h2 .x{cursor:pointer;color:var(--dim);font-size:14px;border:1px solid var(--line);border-radius:6px;padding:2px 9px}
.modal h2 .x:hover{color:var(--red);border-color:var(--red)}
.modal .mfoot{color:var(--dim);font-size:12px;margin-top:14px;font-family:var(--mono)}

/* skill tree */
.skillcat{margin-bottom:16px}
.skillcat h4{font-family:var(--mono);font-size:12px;color:var(--violet);letter-spacing:1px;margin-bottom:8px;border-bottom:1px dashed #26314a;padding-bottom:4px}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.sklnode{
  border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;background:var(--panel2);
}
.sklnode.on{border-color:var(--green);box-shadow:0 0 14px rgba(52,211,153,.15)}
.sklnode .sn{font-family:var(--mono);font-size:12px;color:var(--dim)}
.sklnode.on .sn{color:var(--green)}
.sklnode .sd{color:var(--dim);font-size:11px;margin-top:2px}
.sklnode.lock{opacity:.38;filter:grayscale(.6)}

/* knowledge & error list */
.klist .kitem{border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin-bottom:8px;background:var(--panel2)}
.klist .kitem b{color:var(--cyan)}
.klist .kitem p{font-size:12.5px;color:var(--dim);margin-top:3px}
.klist .kitem .exam{color:var(--amber);font-family:var(--mono);font-size:11px;margin-top:4px}
.err-state{font-family:var(--mono);font-size:10.5px;float:right}
.err-state.pend{color:var(--red)} .err-state.done{color:var(--green)}

/* profile bars */
.pbars .prow{margin-bottom:8px}
.prow .p-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:3px}
.prow .bar i{background:linear-gradient(90deg,var(--violet),var(--cyan))}

/* toast */
/* 文竹伴学（左下角盆栽） */
/* 伴学植物 v2（三盆 + 药剂菜单 + 休息卡） */
#plantBox{position:fixed;left:14px;bottom:12px;z-index:50;cursor:pointer;opacity:.92;display:flex;gap:0;align-items:flex-end;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45));transition:transform .3s}
#plantBox.boost{transform:scale(1.12);filter:drop-shadow(0 0 18px rgba(167,139,250,.55))}
#plantBox svg{overflow:visible}
.pot{background:none;border:0;padding:0;cursor:pointer;display:block}
.pot+.pot{margin-left:-8px}
.pot.locked{filter:grayscale(.8) brightness(.55);opacity:.6}
.pot:hover{transform:translateY(-2px)}
.pl-stem{fill:none;stroke:#5f8f7a;stroke-width:1.4;stroke-linecap:round}
.pl-branch{fill:none;stroke:#6da189;stroke-width:1;opacity:.9}
.pl-leaf{fill:#8fc7a9}
.pl-leaf2{fill:#6da189;opacity:.85}
.pl-seed{fill:#4a5a4e}
.pl-soil{fill:#1c2418}
.pl-pot{fill:#2a3546;stroke:#3d4a5f;stroke-width:1}
.pl-potrim{fill:#34425a}
.pl-frond{transform-origin:50px 64px;animation:plSway 7s ease-in-out infinite}
@keyframes plSway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.bf-bell{fill:#7f9fd4;stroke:#9db8e8;stroke-width:.8}
.bf-rim{stroke:#9db8e8;stroke-width:.9;fill:none;stroke-linecap:round}
.bf-clap{fill:#c6d4ef}
.bf-vine{fill:none;stroke:#6da189;stroke-width:1.3;stroke-linecap:round}
.vs-vine{fill:none;stroke:#7d8fb8;stroke-width:1.3;stroke-linecap:round}
.vs-vine.thin{stroke-width:.9;opacity:.7}
.vs-star{fill:#cdd8ff}
.vs-core{fill:#ffffff;opacity:.9}
.vine-star{animation:vsTwinkle 3.2s ease-in-out infinite}
@keyframes vsTwinkle{0%,100%{opacity:.45}50%{opacity:1}}
.pl-menu{display:none;position:absolute;left:0;bottom:100%;margin-bottom:8px;width:250px;background:#0d1420;border:1px solid var(--green);border-radius:10px;padding:12px 14px;cursor:default;box-shadow:0 8px 30px rgba(0,0,0,.6);transform-origin:bottom left}
#plantBox.open .pl-menu{display:block;animation:menuIn .28s cubic-bezier(.2,.9,.3,1.18) both}
@keyframes menuIn{from{opacity:0;transform:scale(.9) translateY(6px)}to{opacity:1;transform:none}}
.pm-row{font-size:12px;color:var(--ink);line-height:1.9}
.pm-row.dim{color:var(--dim)}
.pm-time{color:var(--cyan);font-family:var(--mono);font-size:11px;margin-top:4px}
.pm-potion{width:100%;margin-top:8px;background:rgba(167,139,250,.15);border:1px solid var(--violet);color:var(--violet);border-radius:8px;padding:8px 10px;font:12px var(--mono);cursor:pointer}
.pm-potion.off{opacity:.35;cursor:not-allowed}
.pm-potion:not(.off):hover{background:rgba(167,139,250,.3)}
.pm-lore{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--dim);line-height:1.7}
@media(max-width:1020px){#plantBox{transform:scale(.75);transform-origin:bottom left}}
/* 休息提醒 */
#restOverlay{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(4,9,14,.9)}
#restOverlay.show{display:flex}
.rest-card{max-width:470px;margin:20px;text-align:center;padding:38px 36px;background:linear-gradient(160deg,#0d1a15,#0b1418);border:1px solid rgba(52,211,153,.5);border-radius:20px;box-shadow:0 0 60px rgba(52,211,153,.12)}
.rest-emoji{font-size:34px;letter-spacing:10px;margin-bottom:10px}
.rest-card h2{font-size:22px;margin-bottom:12px}
.rest-card p{color:var(--dim);font-size:14px;line-height:2;margin-bottom:20px}
.rest-btn{display:block;width:100%;margin-top:10px;background:linear-gradient(90deg,var(--green),var(--cyan));border:none;color:#05070c;font:700 14px var(--mono);border-radius:10px;padding:12px;cursor:pointer}
.rest-btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
/* 季终报告分档 */
.titlecard.tier-legend,.titlecard.tier-star,.titlecard.tier-steady,.titlecard.tier-potential{
  animation:tierIn .8s cubic-bezier(.16,.9,.3,1.12) both;
  position:relative;overflow:hidden;
}
@keyframes tierIn{from{opacity:0;transform:scale(.9);filter:blur(10px)}60%{filter:blur(0)}to{opacity:1;transform:none}}
/* 顶光扫过 */
.titlecard.tier-legend::after,.titlecard.tier-star::after{
  content:'';position:absolute;top:0;left:-30%;width:22%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.09),transparent);
  transform:skewX(-18deg);animation:sheen 3.2s 1s ease-in-out 3;
}
@keyframes sheen{0%,60%{left:-30%}100%{left:130%}}
.titlecard.tier-legend{border-color:var(--violet);box-shadow:0 0 46px rgba(167,139,250,.28);animation:tierIn .8s both, legendPulse 3.4s 1.2s ease-in-out 3}
@keyframes legendPulse{0%,100%{box-shadow:0 0 36px rgba(167,139,250,.22)}50%{box-shadow:0 0 60px rgba(167,139,250,.42)}}
.titlecard.tier-star{border-color:var(--amber);box-shadow:0 0 36px rgba(251,191,36,.18)}
.titlecard.tier-steady{border-color:var(--green);box-shadow:0 0 30px rgba(52,211,153,.15)}
.titlecard.tier-potential{border-color:#5b7f6a}
.tier-quotes{margin:14px 0 4px;display:flex;flex-direction:column;gap:8px}
.tier-quotes .tq{background:rgba(255,255,255,.03);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;padding:9px 13px;font-size:13px;line-height:1.8;color:var(--ink);animation:fadeUp .45s both}
.tier-quotes .tq:nth-child(1){animation-delay:.35s}
.tier-quotes .tq:nth-child(2){animation-delay:.5s}
.tier-quotes .tq b{color:var(--cyan)}
/* 彩带（JS 生成 .confetti） */
.confetti{position:fixed;top:-14px;z-index:350;pointer-events:none;font-size:15px;animation:confettiFall linear forwards}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(108vh) rotate(720deg);opacity:.6}
}

/* 术语悬浮词典 */
.term{border-bottom:1px dotted rgba(34,211,238,.6);cursor:help}
.term:hover{color:var(--cyan)}
#termTip{display:none;position:fixed;z-index:300;width:320px;max-width:calc(100vw - 20px);background:#0d1420;border:1px solid var(--cyan);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.65);pointer-events:none;font-size:12.5px;line-height:1.7}
#termTip .tt-name{color:var(--cyan);font-weight:700;font-size:13px;margin-bottom:4px}
#termTip .tt-en{color:var(--dim);font-weight:400;font-size:11px;font-family:var(--mono)}
#termTip .tt-body{color:var(--ink)}
.glink{margin-top:6px;color:var(--violet);font-family:var(--mono);font-size:11.5px;cursor:pointer}
.glink:hover{color:var(--cyan)}
.lb-me{border:1px solid rgba(34,211,238,.4);border-radius:10px;padding:10px 14px;background:rgba(34,211,238,.05);margin-top:6px}
.lb-pid{font-family:var(--mono);font-size:11px;color:var(--dim)}
.lb-pid b{color:var(--cyan)}
.lb-tower{font-size:13px;margin-top:6px;line-height:1.7}
.lb-tower b{color:var(--amber)}
.lb-parts{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px}
.lb-head{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--dim);margin:12px 0 6px}
.lb-row{display:flex;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px dashed #1a2333}
.lb-name{flex:1;font-size:12.5px}
.lb-tier{font-family:var(--mono);font-size:10.5px}
.lb-tier.t1,.lb-tier.t2,.lb-tier.t3{color:var(--dim)}
.lb-tier.t4,.lb-tier.t5,.lb-tier.t6{color:var(--green)}
.lb-tier.t7,.lb-tier.t8{color:var(--cyan)}
.lb-tier.t9,.lb-tier.t10{color:var(--amber)}
.lb-val{font-family:var(--mono);font-size:12px;color:var(--ink)}
.lb-note{font-size:10.5px;color:var(--dim);margin:-2px 0 4px;padding-left:2px}
.lb-foot{font-size:10.5px;color:var(--dim);margin-top:10px;line-height:1.7}
#toastRoot{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  background:#0d1420;border:1px solid var(--cyan);color:var(--ink);border-radius:8px;padding:10px 16px;
  font-family:var(--mono);font-size:12px;animation:toastIn .38s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 4px 24px rgba(0,0,0,.5);
}
@keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.96)}to{opacity:1;transform:none}}
.toast.ok{border-color:var(--green)} .toast.err{border-color:var(--red)}

/* report */
.report .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.rcell{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel2);text-align:center;animation:rcellIn .4s cubic-bezier(.2,.8,.3,1.15) both}
.rcell:nth-child(1){animation-delay:.25s}.rcell:nth-child(2){animation-delay:.31s}.rcell:nth-child(3){animation-delay:.37s}
.rcell:nth-child(4){animation-delay:.43s}.rcell:nth-child(5){animation-delay:.49s}.rcell:nth-child(n+6){animation-delay:.55s}
@keyframes rcellIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.rcell .rv{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--cyan)}
.rcell .rk{font-size:11px;color:var(--dim);margin-top:2px}
.season2{
  border:1px dashed rgba(167,139,250,.5);border-radius:10px;padding:14px 16px;margin-top:14px;
  color:var(--dim);font-size:13px;background:rgba(167,139,250,.05);
  animation:fadeUp .5s .6s both;
}
.season2 b{color:var(--violet)}
/* 尊重系统减弱动效偏好 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

@media (max-width:1020px){
  #layout{grid-template-columns:1fr;overflow-y:auto}
  #left,#right{flex-direction:row;flex-wrap:wrap}
  #left .panel,#right .panel{flex:1 1 240px}
  body{overflow:auto}
}
</style>
